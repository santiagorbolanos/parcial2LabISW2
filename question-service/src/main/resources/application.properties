spring.application.name=question-service
server.port=8083

# H2 (en memoria)
spring.datasource.url=jdbc:h2:mem:questionsdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
saberpro.rabbit.exchange=saberpro.direct.exchange
saberpro.rabbit.routing-key.submit=question.submit

# Validation Service (REST sincrono)
validation.service.url=http://localhost:8082
